name: Update LeetCode activity

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activity-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch LeetCode submission calendar
        run: node scripts/fetch-leetcode-activity.mjs

      - name: Commit changed data
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- data/leetcode-activity.json)" ]; then
            echo "No LeetCode activity changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leetcode-activity.json
          git commit -m "chore: update LeetCode activity data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
